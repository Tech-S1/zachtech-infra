name: 'Terraform'

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      TF_CLI_ARGS_plan: -input=false -compact-warnings

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.15.0
        terraform_wrapper: false
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Terraform Init
      run: terraform init

    - name: Terraform Format
      run: terraform fmt -check

    - name: Terraform Validate
      run: terraform validate

    - name: Checkov
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: .
        framework: terraform
        download_external_modules: false
        compact: true
        quiet: true
        skip_check: CKV_AWS_18,CKV_AWS_19,CKV_AWS_21,CKV_AWS_86,CKV_AWS_144,CKV_AWS_145,CKV_AWS_310,CKV2_AWS_32,CKV2_AWS_47,CKV2_AWS_61,CKV2_AWS_62

    - name: Terraform Plan
      if: github.ref != 'refs/heads/main' 
      run: |
        set +e
        terraform plan -detailed-exitcode > /tmp/tf.log 2>&1
        exit_code=$?
        set -e

        run_url=$(grep -Eo 'https://app\.terraform\.io/app/[^[:space:]]+' /tmp/tf.log | head -1 || true)
        if [ -n "$run_url" ]; then
          echo "HCP Terraform run: $run_url"
        fi

        if [ "$exit_code" -eq 1 ]; then
          echo "Terraform plan failed"
          exit 1
        fi

        if [ "$exit_code" -eq 2 ]; then
          echo "Terraform plan succeeded with changes"
        else
          echo "Terraform plan succeeded with no changes"
        fi

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    env:
      TF_CLI_ARGS_apply: -input=false -compact-warnings

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.15.0
        terraform_wrapper: false
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Terraform Init
      run: terraform init

    - name: Terraform Apply
      run: |
        set +e
        terraform apply -auto-approve > /tmp/tf.log 2>&1
        exit_code=$?
        set -e

        run_url=$(grep -Eo 'https://app\.terraform\.io/app/[^[:space:]]+' /tmp/tf.log | head -1 || true)
        if [ -n "$run_url" ]; then
          echo "HCP Terraform run: $run_url"
        fi

        if [ "$exit_code" -ne 0 ]; then
          echo "Terraform apply failed"
          exit 1
        fi

        echo "Terraform apply succeeded"
