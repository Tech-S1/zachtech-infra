name: 'Terraform'

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_IN_AUTOMATION: true
      TF_CLI_ARGS_plan: -input=false -compact-warnings
      TF_CLI_ARGS_apply: -input=false -compact-warnings

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.15.0
        terraform_wrapper: false
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Terraform Init
      run: terraform init

    - name: Terraform Format
      run: terraform fmt -check

    - name: Terraform Plan
      run: |
        set +e
        terraform plan -detailed-exitcode > /tmp/tf.log 2>&1
        exit_code=$?
        set -e

        run_url=$(grep -Eo 'https://app\.terraform\.io/app/[^[:space:]]+' /tmp/tf.log | head -1 || true)
        if [ -n "$run_url" ]; then
          echo "HCP Terraform run: $run_url"
        fi

        if [ "$exit_code" -eq 1 ]; then
          echo "Terraform plan failed"
          exit 1
        fi

        if [ "$exit_code" -eq 2 ]; then
          echo "Terraform plan succeeded with changes"
        else
          echo "Terraform plan succeeded with no changes"
        fi

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        set +e
        terraform apply -auto-approve > /tmp/tf.log 2>&1
        exit_code=$?
        set -e

        run_url=$(grep -Eo 'https://app\.terraform\.io/app/[^[:space:]]+' /tmp/tf.log | head -1 || true)
        if [ -n "$run_url" ]; then
          echo "HCP Terraform run: $run_url"
        fi

        if [ "$exit_code" -ne 0 ]; then
          echo "Terraform apply failed"
          exit 1
        fi

        echo "Terraform apply succeeded"
